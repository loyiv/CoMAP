project_root: ${COMAP_ROOT}

models:
  # Paper setting: the policy and world model use the same backbone family and tokenizer template.
  base_policy_model: Qwen/Qwen3-4B
  base_world_model: ${COMAP_ROOT}/checkpoints/wm/wm_warmup_alfworld
  base_teacher_world_model: ${COMAP_ROOT}/checkpoints/wm/wm_warmup_alfworld

task:
  name: alfworld
  exp_config: alfworld
  agent_config: coevolving_local_hf
  train_size: 3119
  test_seen_size: 140
  test_unseen_size: 171

pipeline:
  coevolving_rounds: 3
  fallback_agent_backend_without_wm: local_hf

bridge:
  episode_filter: successful_or_all
  val_ratio: 0.1
  policy_dataset_mode: coevolving
  include_expert_anchors: true
  include_draft_distill: true
  require_success_for_hq: true
  allow_fallback_to_all_steps: true
  wm_consistency_min: null

rollout:
  conda_env: comap
  agent_backend: auto
  controller_port: 21001
  worker_port: 21002
  wait_seconds: 45
  split: train
  override: true
  max_new_tokens: 64
  reflect_max_new_tokens: 128
  final_max_new_tokens: 16
  wm_max_new_tokens: 192
  temperature: 0.7
  top_p: 0.9
  revise_probability_threshold: 0.5
  reflection_confidence_threshold: 0.6
  part_num: 1
  part_idx: -1
  debug: false
  enable_thinking: false
  include_teacher_world_model: true

evaluation:
  conda_env: comap
  agent_backend: auto
  controller_port: 21011
  worker_port: 21012
  wait_seconds: 45
  split: test
  override: true
  max_new_tokens: 64
  reflect_max_new_tokens: 128
  final_max_new_tokens: 16
  wm_max_new_tokens: 192
  temperature: 0.7
  top_p: 0.9
  revise_probability_threshold: 0.5
  reflection_confidence_threshold: 0.6
  part_num: 1
  part_idx: -1
  debug: false
  enable_thinking: false
  include_teacher_world_model: false

world_model:
  conda_env: comap
  base_model_path: null
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_prompt_length: 2048
  max_target_length: 192
  distill_weight: 0.5
  ema_momentum: 0.99
  world_state_threshold: 0.6
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  gradient_checkpointing: true
  teacher_update_strategy: ema

sdpo:
  conda_env: comap
  config_name: sdpo
  rollout_backend: hf
  train_batch_size: 1
  rollout_batch_size: 1
  learning_rate: 2.0e-5
  alpha: 1.0
  bce_weight: 0.01
  success_reward_threshold: 1.0
  teacher_regularization: ema
  teacher_update_rate: 0.01
  include_environment_feedback: true
  environment_feedback_only_without_solution: true
  enable_auxiliary_supervision: true
  reflect_main_loss_weight: 1.0
  draft_distill_loss_weight: 0.25
  expert_anchor_loss_weight: 0.5
  transition_fallback_loss_weight: 0.1
  max_model_len: 2304
  max_prompt_length: 2048
  max_response_length: 64
  n_gpus_per_node: 4
  nnodes: 1
  extra_overrides:
    - trainer.total_epochs=3
    - trainer.save_freq=1
    - trainer.test_freq=0
    - trainer.logger=[console]
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.self_distillation.alpha=0.5
    - actor_rollout_ref.actor.self_distillation.teacher_regularization=ema
    - actor_rollout_ref.actor.self_distillation.teacher_update_rate=0.01
    - actor_rollout_ref.model.lora_rank=8
    - actor_rollout_ref.model.lora_alpha=16
